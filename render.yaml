# Render blueprint — deploys NeuroPay AI as a single Docker web service.
#
# The data layer is hosted Postgres (DATABASE_URL): the app was ported off
# embedded SQLite, so the service needs NO persistent disk and can run on
# Render's free plan. Point DATABASE_URL at any Postgres — e.g. a free
# Supabase project's connection string (session pooler, port 5432).
#
# Secrets (DATABASE_URL, JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD,
# OPENAI_API_KEY, STRIPE_SECRET_KEY) are declared with sync: false — set
# their values in the Render dashboard under Environment. Never commit them.

services:
  - type: web
    name: neuropay-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_ON_BOOT
        value: "true"
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
